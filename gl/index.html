<!DOCTYPE html>
<html lang="zh">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<div class="window">

        <div class="mac-btns">
            <div class="mac-btn close"></div>
            <div class="mac-btn minimize"></div>
            <div class="mac-btn maximize"></div>

        <div class="title">haruko386.go</div>
    </div>

    <div class="main-content">
        <div class="editor-body" aria-label="haruko386.go source code">

                    <div class="divider"></div>

        <div id="egg-image-container">
